spring.application.name=estatia
server.forward-headers-strategy=framework

spring.session.jdbc.initialize-schema=always
spring.session.store-type=jdbc

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DATABASE_NAME:mydb}
spring.datasource.username=${DATABASE_USER:myuser}
spring.datasource.password=${DATABASE_PASSWORD:mypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.iamspase=DEBUG
logging.level.org.springframework.web=INFO

spring.security.oauth2.client.registration.auth0.client-id=${AUTH0_CLIENT_ID}
spring.security.oauth2.client.registration.auth0.client-secret=${AUTH0_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0.scope=openid,profile,email

spring.security.oauth2.client.provider.auth0.issuer-uri=https://dev-mccdojhowlja4t33.eu.auth0.com/

spring.devtools.restart.enabled=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

