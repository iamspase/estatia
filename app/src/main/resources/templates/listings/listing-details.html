<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title th:text="'Estatia - ' + ${listing.title}">Estatia - Listing</title>
</head>
<body>
<section>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">

    <style>
        /* Scoped to this page; uses your theme tokens. Plain CSS so it doesn't depend on Bootstrap 6 class names. */
        .ld-top { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1.5rem; }
        .ld-image { position: relative; min-height: 300px; min-width: 0; flex: 1 1 0;
            border-radius: 1rem; overflow: hidden; }
        .ld-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .ld-details { flex: none; }
        @media (min-width: 768px) {
            .ld-top { flex-direction: row; align-items: stretch; }
            .ld-details { flex: 0 0 380px; }
        }

        .ld-card { display: flex; flex-direction: column; background: var(--bs-bg-1);
            border: 1px solid var(--bs-border-muted); border-radius: 1rem; padding: 1.5rem; }
        .ld-price { font-size: 2rem; font-weight: 700; line-height: 1.2; margin: 0 0 .25rem;
            color: var(--bs-primary-fg); }
        .ld-title { font-size: 1.25rem; font-weight: 600; margin: 0 0 .25rem; }
        .ld-place { color: var(--bs-fg-3); margin: 0 0 1.5rem; }

        .ld-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 1.5rem; }
        .ld-tile { background: var(--bs-bg-2); border-radius: .75rem; padding: .5rem .75rem; }
        .ld-label { font-size: .8125rem; color: var(--bs-fg-3); }
        .ld-value { font-weight: 600; }

        .ld-row { display: flex; justify-content: space-between; gap: 1rem; font-size: .875rem; padding: .25rem 0; }
        .ld-row .ld-label { font-size: inherit; }

        .ld-actions { display: flex; gap: .5rem; margin-top: auto; padding-top: 1.5rem; }
        .ld-actions > * { flex: 1; }
        .ld-actions form button { width: 100%; }

        .ld-heading { font-size: 1.125rem; font-weight: 600; margin: 0 0 .75rem; }
        .ld-contact { display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 1rem; }
        .ld-contact-actions { display: flex; gap: .5rem; }

        .ld-swiper, .ld-swiper .swiper-slide { height: 100%; }
        .ld-swiper { position: absolute; inset: 0; }

        .ld-swiper .swiper-slide a { display: block; height: 100%; cursor: zoom-in; }
    </style>

    <!-- Top row: image (left) + details card (right) -->
    <div class="ld-top">

        <div class="ld-image">
            <div class="swiper ld-swiper" th:if="${!listing.images.isEmpty()}">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" th:each="key, st : ${listing.images}">
                        <a class="glightbox" data-gallery="listing"
                           th:href="@{'/images/' + ${key}}">
                            <img th:src="@{'/images/' + ${key}}"
                                 th:alt="${listing.title}"
                                 th:attr="loading=${st.first} ? 'eager' : 'lazy'">
                        </a>
                    </div>
                </div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-pagination"></div>
            </div>

            <!-- fallback when the listing has no photos -->
            <img th:if="${listing.images.isEmpty()}"
                 src="https://images.unsplash.com/photo-1781473252810-801e30ba8da2?q=80&w=983&auto=format&fit=crop"
                 th:alt="${listing.title}">
        </div>

        <div class="ld-details">
            <div class="ld-card h-100" style="height: 100%;">

                <p class="ld-price"
                   th:text="${#numbers.formatDecimal(listing.pricing, 1, 'COMMA', 0, 'POINT')} + ' €'">
                    120,000 €
                </p>
                <h1 class="ld-title" th:text="${listing.title}">Bright 2-bedroom apartment</h1>
                <p class="ld-place">
                    <span th:if="${listing.neighbourhood != null}"
                          th:text="${listing.neighbourhood.name} + ', '">Lozenets, </span>
                    <span th:text="${listing.city.name}">Sofia</span>
                </p>

                <!-- Key facts as tiles -->
                <div class="ld-tiles">
                    <div class="ld-tile">
                        <div class="ld-label">Area</div>
                        <div class="ld-value" th:text="${listing.area} + ' m²'">85 m²</div>
                    </div>
                    <div class="ld-tile">
                        <div class="ld-label">Rooms</div>
                        <div class="ld-value" th:text="${listing.rooms}">3</div>
                    </div>
                    <div class="ld-tile">
                        <div class="ld-label">Floor</div>
                        <div class="ld-value" th:text="${listing.floor}">4</div>
                    </div>
                    <div class="ld-tile">
                        <div class="ld-label">Type</div>
                        <div class="ld-value" th:text="${listing.propertyType}">Apartment</div>
                    </div>
                </div>

                <!-- Secondary info -->
                <div class="ld-row">
                    <span class="ld-label">Address</span>
                    <span th:text="${listing.address}">12 Vitosha Blvd</span>
                </div>
                <div class="ld-row">
                    <span class="ld-label">Views</span>
                    <span th:text="${listing.listingVisits}">0</span>
                </div>
                <div class="ld-row">
                    <span class="ld-label">Posted</span>
                    <span th:text="${#temporals.format(listing.createdAt, 'dd MMM yyyy')}">01 Nov 2026</span>
                </div>

                <!-- Owner-only actions -->
                <div class="ld-actions" th:if="${isOwner}">
                    <a class="btn-solid theme-primary"
                       th:href="@{/listings/{id}/edit(id=${listing.id})}">Edit</a>
                    <form method="post"
                          th:action="@{/listings/{id}/delete(id=${listing.id})}"
                          onsubmit="return confirm('Delete this listing? This cannot be undone.');">
                        <button type="submit" class="btn-outline theme-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Description -->
    <div class="ld-card" style="margin-bottom: 1.5rem;">
        <h2 class="ld-heading">Description</h2>
        <p style="white-space: pre-line; margin: 0;" th:text="${listing.description}">
            Listing description goes here.
        </p>
    </div>

    <!-- Contact -->
    <div class="ld-card">
        <h2 class="ld-heading">Contact</h2>
        <div class="ld-contact">
            <div>
                <div class="ld-value" th:text="${listing.owner.name}">John Doe</div>
                <div class="ld-label" th:text="${listing.owner.email}">john@example.com</div>
                <div class="ld-label" th:text="${listing.owner.phone}">+359 888 123 456</div>
            </div>
            <div class="ld-contact-actions">
                <a class="btn-solid theme-primary" th:href="'tel:' + ${listing.owner.phone}">Call</a>
                <a class="btn-outline theme-primary" th:href="'mailto:' + ${listing.owner.email}">Email</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!document.querySelector('.ld-swiper')) return;
            new Swiper('.ld-swiper', {
                keyboard: { enabled: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
                pagination: { el: '.swiper-pagination', clickable: true }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!document.querySelector('.ld-swiper')) return;
            new Swiper('.ld-swiper', { /* your existing options */ });
            GLightbox({ selector: '.glightbox', touchNavigation: true, loop: true });
        });
    </script>
</section>
</body>
</html>
